name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shells to check completions against
        run: sudo apt-get update && sudo apt-get install -y zsh fish shellcheck
      - uses: dtolnay/rust-toolchain@stable
      - run: sh -n install.sh && sh -n uninstall.sh
      - run: shellcheck install.sh uninstall.sh
      - run: bash -n completions/func.bash
      - run: zsh -n completions/_func
      - run: fish --no-execute completions/func.fish
      - name: Installer round trip
        run: |
          export HOME="$(mktemp -d)"
          ./install.sh
          "$HOME/.local/bin/func" --version
          ./uninstall.sh
